openapi: 3.1.0
info:
  title: Keel API
  version: 0.1.0
  summary: Core reads and writes for Keel v1.
  description: |
    The contract for Keel's core reads and writes, written before any code exists.

    Four rules run through the whole document.

    **No user identifier appears in any path.** Every request is scoped to the
    authenticated session, and every query is filtered by that user server-side.
    A path that could name another user's row is a path that can leak one (NFR-10).

    **Every operation declares how it fails.** There is no operation with only a
    success response. Failures use RFC 9457 Problem Details, so one shape covers
    every error the client has to render (NFR-07).

    **No aggregate is stored, and none is written.** Adherence, totals, streaks,
    extension counts and sequence numbers appear in responses only, computed at
    read time. No request body may set one (NFR-09).

    **A recorded date comes from the client; a comparison with today uses the
    user's zone.** Every date the record keeps — the day of an entry, a
    deviation, a status change, the day an idea was caught or judged — is sent
    by the client and stored as sent, never stamped from the server clock
    (NFR-12). Where the server must compare against *today* — a deviation dated
    in the future, an extension that must end after today, whether a lock has
    lifted — it reads today in the user's stored `tz`.

    Out of scope for v1: offline logging (NFR-06). There is no sync endpoint, no
    client-supplied identifier, and no conflict resolution.
servers:
  - url: /v1
    description: |
      Every operation is versioned under `/v1`, except the health check (below).
      Relative: requests go to whichever host served this document — localhost in
      development, the deployed domain in production. No environment is named
      here, so the interactive page and the code cannot disagree about where the
      API lives (ADR-004).

tags:
  - name: Session
    description: Sign in and out. A session survives the auth service being unreachable (NFR-08).
  - name: Today
    description: The one read behind the Today screen.
  - name: Effort
    description: What you actually did.
  - name: Objectives
    description: Commitments, their schedules and their status.
  - name: Reviews
    description: Per objective, per period.
  - name: Deviations
    description: Belongs to a day, not an objective.
  - name: Parking lot
    description: Ideas, locked, and their verdict history.

security:
  - sessionCookie: []

paths:
  /health:
    servers:
      - url: /
        description: |
          Unversioned, deliberately. The load balancer's health check, the deploy
          smoke check and the runbook all call `/health`; it describes the
          running service, not a version of the API, and moving it would fail
          every task during the deploy that moved it.
    get:
      tags: [Ops]
      summary: Liveness and database reachability
      description: |
        Two distinct answers. `app` is "ok" whenever this responds at all — an
        app crash shows as no response, never a body. `database` is the result
        of a real round trip. Status is 200 when the database answers and 503
        when only the app is up, so an outage is distinguishable from a crash.
        Public: no session required (W3-16).
      operationId: getHealth
      security: []
      responses:
        '200':
          description: App alive and database reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: App alive but the database is unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /session:
    get:
      tags: [Session]
      summary: Who is signed in
      description: |
        Read from the session cookie alone — no database read and no call to
        Cognito. The name was copied from the ID token when the session was
        created, so a rename at Cognito shows at the next sign-in.
      operationId: getSession
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Session]
      summary: Turn a fresh Cognito sign-in into a Keel session
      description: |
        The browser has just proved the password to Cognito itself (SRP, through
        Amplify Auth on Keel's sign-in screen) and holds Cognito's tokens in
        memory. It sends the ID token here; Keel verifies it locally against
        Cognito's published keys, finds the local user by subject or creates it
        (`docs/erd.md`, *User*), and sets its own session cookie. The browser then
        discards every Cognito token (ADR-002). No password ever reaches this
        endpoint, and the token is never logged.

        `tz` is the browser's zone. Every sign-in stores it as the user's zone —
        the first one, after creating an account, included — so the server reads
        "today" in the zone the user last signed in from (I-07).
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token, tz]
              properties:
                id_token: { type: string, minLength: 1 }
                tz:
                  type: string
                  minLength: 1
                  description: An IANA time zone, e.g. Asia/Kolkata. One the server does not know is refused with 400.
      responses:
        '204':
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401':
          description: |
            The token is not one Keel accepts: a bad signature, another pool's or
            client's token, an access token instead of an ID token, expired, an
            unverified email, or a sign-in older than five minutes. Nothing is
            written and no session is issued.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: |
            The request's `Origin` is not Keel's own. A session is only ever
            created from Keel's sign-in screen.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            The email already belongs to a Keel user under a different subject —
            a provider account deleted and recreated with the same address.
            Nothing is written and no session is issued; reconnecting the two is
            an operator's decision (`docs/runbook.md`), never the app's.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Session]
      summary: Sign out
      operationId: deleteSession
      responses:
        '204': { description: Signed out. The cookie is cleared. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }


  /day/{date}:
    get:
      tags: [Today]
      summary: Everything the Today screen needs, in one round trip
      description: |
        This is the read NFR-03 constrains: p95 under 300 ms, and one request
        rather than one per objective. It returns every active objective, the
        plan slot computed for `date` if the plan asks for one, that date's entries, and the
        totals the sidebar shows.

        An objective with `slot: null` is not scheduled for this date. Logging
        against it is still allowed and the resulting entry is `extra`.
      operationId: getDay
      parameters:
        - name: date
          in: path
          required: true
          description: A local calendar date, not an instant. The client sends the day it means.
          schema: { type: string, format: date }
          example: '2026-09-05'
      responses:
        '200':
          description: The day.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Day' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /objectives/{objectiveId}/effort-entries:
    get:
      tags: [Effort]
      summary: An objective's entries over a date range, with their times
      description: |
        The Effort tab's *Last day* card and *Week* dialog. One call for any
        range, so a week is not seven calls to `GET /day/{date}`. Read-only:
        entries are edited from Today.
      operationId: listObjectiveEntries
      parameters:
        - { $ref: '#/components/parameters/objectiveId' }
        - name: from
          in: query
          required: true
          description: First day, inclusive.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: Last day, inclusive.
          schema: { type: string, format: date }
      responses:
        '200':
          description: The entries in the range, by date, then start time, then when each was logged.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/EffortEntry' }
        '400':
          description: '`from` or `to` is missing or malformed, or `to` is before `from`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Effort]
      summary: Log effort
      description: |
        `local_date` and `tz` are both required and both come from the client.
        The server never derives the day from the time the request arrived — an
        entry logged at 23:55 belongs to that date for good (NFR-12).

        Effort is logged **only for today**: `local_date` must be today in `tz`.
        Once a day is over, its effort is fixed, so a saved review's recomputed
        figures move only if a rule changes (`docs/erd.md`, invariant 18).
      operationId: createEffortEntry
      parameters: [{ $ref: '#/components/parameters/objectiveId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EffortEntryWrite' }
      responses:
        '201':
          description: Logged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffortEntry' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            The objective is not active, or `local_date` falls outside every plan
            segment, or `local_date` is not today in `tz`, or the entry's start and
            minutes overlap another of the caller's entries on that day, under any
            objective. Ended and completed objectives accept no new effort.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /effort-entries/{entryId}:
    patch:
      tags: [Effort]
      summary: Edit an entry
      description: |
        Editable only from Today, and only on the entry's own day in the zone it
        was logged in. `local_date` cannot be changed.
      operationId: updateEffortEntry
      parameters: [{ $ref: '#/components/parameters/entryId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minutes: { type: integer, minimum: 1, maximum: 1440 }
                occurred_at_local: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                note: { type: string, maxLength: 2000 }
                link: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffortEntry' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            The entry's objective is not active, or the entry's day is over in the
            zone it was logged in, or the new start and minutes overlap another of
            the caller's entries on that day. Effort on a completed, ended or
            paused objective is the record as it stood, and is corrected only
            while the objective is running — the same rule that stops new effort
            being logged against it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Effort]
      summary: Delete an entry
      operationId: deleteEffortEntry
      parameters: [{ $ref: '#/components/parameters/entryId' }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            The entry's objective is not active, or the entry's day is over in the
            zone it was logged in. Effort on a completed, ended or paused
            objective is the record as it stood, and is corrected only while the
            objective is running — the same rule that stops new effort being
            logged against it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /objectives:
    get:
      tags: [Objectives]
      summary: List objectives
      operationId: listObjectives
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, paused, completed, ended]
            default: all
      responses:
        '200':
          description: Objectives, with computed adherence for each.
          content:
            application/json:
              schema:
                type: object
                required: [objectives]
                properties:
                  objectives:
                    type: array
                    items: { $ref: '#/components/schemas/ObjectiveSummary' }
                  committed_minutes_per_week:
                    type: integer
                    description: |
                      Computed across active objectives, from the segment in force
                      today for each: a fixed segment commits its planned weekdays
                      × minutes per planned day; a flexible one, days per week ×
                      minutes. Paused objectives commit nothing.
        '400':
          description: '`status` is not one of the listed values.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/MalformedRecord' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Objectives]
      summary: Create an objective
      description: Creates the objective and its first plan segment. Slots are computed on read, never written (ADR-008).
      operationId: createObjective
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectiveWrite' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objective' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: |
            The schedule is flexible — v1 creates fixed objectives only (I-09) —
            or inconsistent with its mode — a day count for a fixed one — or the parked
            idea named is not the caller's, or is not **approved** — only an
            approved idea can be taken. A locked one may be; that is an early
            take, not an error (`docs/domain/parking-lock.md`). The `taken` verdict
            is dated today in `tz`, the day the objective is created, not
            `starts_on`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /objectives/{objectiveId}:
    get:
      tags: [Objectives]
      summary: One objective, with its whole-run figures
      operationId: getObjective
      parameters: [{ $ref: '#/components/parameters/objectiveId' }]
      responses:
        '200':
          description: The objective, its segments, its status history and its computed figures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objective' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/MalformedRecord' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /objectives/{objectiveId}/effort:
    get:
      tags: [Effort]
      summary: The Effort tab — every session, month by month
      description: Read-only. Entries are edited from Today, never from here.
      operationId: listObjectiveEffort
      parameters:
        - { $ref: '#/components/parameters/objectiveId' }
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
          example: '2026-09'
      responses:
        '200':
          description: Days in the month, grouped by week, including planned days with no entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffortMonth' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /objectives/{objectiveId}/schedule:
    get:
      tags: [Objectives]
      summary: The schedule grid — one row per day, five states
      description: |
        The day-by-day grid the objective overview draws. Its own endpoint,
        not a field on `GET /objectives/{objectiveId}`, because the grid is the
        largest thing that response could carry and most callers do not want it
        (G-03). A future calendar view reads the same shape.

        The grid is computed on the server from the segment's schedule and the
        logged entries, so the client never fans out per day — the read that
        NFR-03 exists to prevent. Spans plan segments; each day names the
        segment it falls in, so an extension with a different schedule renders
        correctly. `off_day_worked` is a genuine day state, not an error: effort
        logged on a day the plan did not ask for.
      operationId: getObjectiveSchedule
      parameters:
        - { $ref: '#/components/parameters/objectiveId' }
        - name: from
          in: query
          required: false
          description: First day to return, inclusive. Defaults to the objective's start.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Last day to return, inclusive. Defaults to the latest segment's end.
          schema: { type: string, format: date }
      responses:
        '200':
          description: The requested days, in date order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleGrid' }
        '400':
          description: '`to` is before `from`, or a date is malformed.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/MalformedRecord' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /objectives/{objectiveId}/notes:
    post:
      tags: [Objectives]
      summary: Add a note to an objective
      description: |
        Append-only: a note is never edited or deleted. Open in every state,
        including after an objective has reached a final one.
      operationId: createObjectiveNote
      parameters:
        - { $ref: '#/components/parameters/objectiveId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteWrite' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`written_on` is in the future.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /objectives/{objectiveId}/status-changes:
    post:
      tags: [Objectives]
      summary: Pause, resume, complete or end
      description: |
        Append-only. Nothing is ever deleted, and a status change never edits an
        earlier one. A paused stretch produces no slots; resuming produces them again.
      operationId: createStatusChange
      parameters: [{ $ref: '#/components/parameters/objectiveId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [change, occurred_on]
              properties:
                change: { type: string, enum: [pause, resume, complete, end] }
                occurred_on:
                  type: string
                  format: date
                  description: The day it happened, in the user's zone. Stored as sent.
                reason: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEvent' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The change does not follow from the current status — resuming an
            objective that is not paused, or ending one already ended — or
            `occurred_on` is earlier than the latest status change, which would
            rewrite the order of an append-only history.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /objectives/{objectiveId}/extensions:
    post:
      tags: [Objectives]
      summary: Extend — add a plan segment
      description: |
        An extension carries its own schedule. It may differ from the segment
        before it, which is why a schedule belongs to a segment rather than to
        the objective.

        Two rules the contract enforces rather than the UI: the extension must be
        authorised by a saved plan-end review that has not already extended, and
        the resulting end date must be strictly in the future.
      operationId: createExtension
      parameters: [{ $ref: '#/components/parameters/objectiveId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_id, extend_by_days, reason, schedule]
              properties:
                review_id:
                  type: string
                  format: uuid
                  description: The saved plan-end review authorising this extension.
                extend_by_days: { type: integer, minimum: 1, maximum: 365 }
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Required. "Why extend rather than complete?"
                schedule: { $ref: '#/components/schemas/ScheduleWrite' }
      responses:
        '201':
          description: New segment created. Its slots follow from it on the next read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanSegment' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            No saved plan-end review authorises this, the review named has already
            produced a segment, its outcome is not `continued`, or the plan end date
            has not yet passed. Only `continued` authorises an extension, and only
            one (`docs/erd.md`, invariant 7).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            The new end date is not strictly after today, or the schedule is
            flexible (v1 plans fixed objectives only, I-09). An extension that would
            end in the past is refused, never silently adjusted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /objectives/{objectiveId}/reviews:
    get:
      tags: [Reviews]
      summary: The Reviews tab
      operationId: listReviews
      parameters: [{ $ref: '#/components/parameters/objectiveId' }]
      responses:
        '200':
          description: |
            Saved reviews newest last, plus the draft if one exists, and every
            window that is due — started or not — so the tab can show one card per
            owed review (`docs/domain/review-windows.md`).
          content:
            application/json:
              schema:
                type: object
                required: [reviews, due]
                properties:
                  reviews:
                    type: array
                    items: { $ref: '#/components/schemas/ReviewSummary' }
                  due:
                    type: array
                    description: Oldest first. The same windows `reviews_due` counts.
                    items: { $ref: '#/components/schemas/DueReview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Reviews]
      summary: Start or resume the review for a period
      description: |
        Idempotent for a period. Called twice it returns the same draft, with
        `201` the first time and `200` afterwards — which is what makes "Start
        review" and "Resume draft" the same button.

        The body is optional (G-05). With **no body**, the server starts or
        resumes the period that is currently due — the client never has to name
        one, so it cannot name a wrong one across an extension boundary, where
        the cadence-to-window rule is easy to get wrong client-side. A body is
        accepted only to resume a specific earlier draft; the server rejects a
        `period_start`/`period_end` that is not a real review window for this
        objective rather than inventing a review for it.
      operationId: startReview
      parameters: [{ $ref: '#/components/parameters/objectiveId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: |
                Omit entirely to let the server pick the due period. Both dates
                are required together when present.
              properties:
                period_start: { type: string, format: date }
                period_end: { type: string, format: date }
              dependentRequired:
                period_start: [period_end]
                period_end: [period_start]
      responses:
        '200':
          description: An existing draft for this period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '201':
          description: A new draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A saved review already covers this period.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            No body was sent and no review is currently due, so there is no
            period to open. The client should not offer "Start review" in this
            state — the same signal `next_review_on` carries on the objective.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /reviews/{reviewId}:
    get:
      tags: [Reviews]
      summary: One review, with its figures recomputed
      description: |
        Every figure in the response is computed now, from entries and the plan.
        None of it was stored when the review was saved, so a review opened today
        and the same review opened next year show the same numbers only because
        the underlying rows have not changed.
      operationId: getReview
      parameters: [{ $ref: '#/components/parameters/reviewId' }]
      responses:
        '200':
          description: The review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      tags: [Reviews]
      summary: Autosave the draft
      description: Called as typing pauses. Only a draft accepts writes.
      operationId: updateReview
      parameters: [{ $ref: '#/components/parameters/reviewId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewWrite' }
      responses:
        '200':
          description: Draft updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The review is saved. A saved review is the record of what you concluded then, and nothing changes it afterwards (NFR-01).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            A criteria assessment or an outcome was sent on a weekly or monthly
            review. Only a plan-end review carries either.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Reviews]
      summary: Discard the draft
      operationId: discardReview
      parameters: [{ $ref: '#/components/parameters/reviewId' }]
      responses:
        '204': { description: Draft discarded. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The review is saved. A saved review is never deleted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /reviews/{reviewId}/save:
    post:
      tags: [Reviews]
      summary: Save the review
      description: Turns the draft into a record. After this it appears in the reviews list.
      operationId: saveReview
      parameters: [{ $ref: '#/components/parameters/reviewId' }]
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already saved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            A plan-end review is missing its outcome or its criteria verdict, or a
            chosen deviation in the period has not been judged.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /reviews/{reviewId}/deviation-verdicts/{deviationId}:
    put:
      tags: [Reviews]
      summary: Judge a chosen deviation
      description: |
        Idempotent — the same verdict sent twice leaves one row. A verdict names
        the review that gave it and is never changed by a later review.
      operationId: setDeviationVerdict
      parameters:
        - { $ref: '#/components/parameters/reviewId' }
        - name: deviationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict: { type: string, enum: [worth_it, not_worth_it] }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deviation' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: An earlier review already judged this deviation.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            The deviation is drifted, its date is outside this review's period, or
            it does not name this review's objective. Only chosen deviations are
            judged, and only by a review of an objective they name.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /deviations:
    get:
      tags: [Deviations]
      summary: List deviations in a date range
      description: |
        Every deviation in the range — the Deviations screen. Each lists the
        objectives it names; pass `objective_id` to see only the deviations that
        name that one.
      operationId: listDeviations
      parameters:
        - name: objective_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Deviations, newest first, with computed cost totals by kind.
          content:
            application/json:
              schema:
                type: object
                required: [deviations]
                properties:
                  deviations:
                    type: array
                    items: { $ref: '#/components/schemas/Deviation' }
                  cost:
                    type: object
                    description: Computed, never stored.
                    properties:
                      chosen: { $ref: '#/components/schemas/CostTally' }
                      drifted: { $ref: '#/components/schemas/CostTally' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Deviations]
      summary: Record a deviation
      description: |
        A deviation names the objectives it pulled you off — one or several, your
        choice. It appears in the reviews of every objective it names.
      operationId: createDeviation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviationWrite' }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deviation' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: |
            An objective named is not yours, is not active, or has no plan segment
            covering `local_date`; `local_date` is in the future; the pattern
            named does not exist; or a `chosen` deviation came without its
            reasoning. Each objective named must be one that could take
            effort on that day.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /deviation-patterns:
    get:
      tags: [Deviations]
      summary: Named patterns, with how often each has happened
      operationId: listDeviationPatterns
      responses:
        '200':
          description: Patterns. The count beside each is computed.
          content:
            application/json:
              schema:
                type: object
                required: [patterns]
                properties:
                  patterns:
                    type: array
                    items: { $ref: '#/components/schemas/DeviationPattern' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Deviations]
      summary: Name a new pattern
      operationId: createDeviationPattern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviationPattern' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: A pattern with that name already exists.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /parked-ideas:
    get:
      tags: [Parking lot]
      summary: The parking lot
      operationId: listParkedIdeas
      parameters:
        - name: caught_on
          in: query
          required: false
          description: |
            A day an idea might be caught on. When sent, the response also carries
            the lock an idea parked that day would get — the *Park an idea* dialog's
            "Locked until" before anything is saved.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Ideas with their current verdict and whether the lock has lifted.
          content:
            application/json:
              schema:
                type: object
                required: [ideas]
                properties:
                  ideas:
                    type: array
                    items: { $ref: '#/components/schemas/ParkedIdea' }
                  new_idea_locked_until:
                    type: string
                    format: date
                    description: |
                      Present only when `caught_on` is sent. The same rule that
                      sets `locked_until` when the idea is parked
                      (`docs/domain/parking-lock.md`).
        '400':
          description: '`caught_on` is malformed.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Parking lot]
      summary: Park an idea
      description: |
        The lock length is set by the server, not the client. An idea you can
        unlock is not locked. The rule is `docs/domain/parking-lock.md`.
      operationId: createParkedIdea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idea, why, caught_on]
              properties:
                idea: { type: string, minLength: 1, maxLength: 300 }
                why: { type: string, minLength: 1, maxLength: 2000 }
                caught_on: { type: string, format: date, description: 'The day, in the user''s zone. Stored as sent.' }
      responses:
        '201':
          description: Parked, with its lock date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParkedIdea' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /parked-ideas/{ideaId}/verdicts:
    post:
      tags: [Parking lot]
      summary: Give or change a verdict
      description: |
        Append-only, which is what lets a review show the verdict as it stood at
        the time. The lock does not refuse a verdict: one given before
        `locked_until` is recorded as early (`docs/domain/parking-lock.md`).
        Dropped is final.
      operationId: createParkedIdeaVerdict
      parameters:
        - name: ideaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict, occurred_on]
              properties:
                verdict:
                  type: string
                  enum: [parked, approved, dropped]
                  description: |
                    An idea moves between `parked` and `approved` freely, and from
                    either to `dropped`. `taken` is not sent here: an approved idea
                    is taken by creating an objective from it
                    (`from_parked_idea_id`), which writes the `taken` row itself.
                occurred_on: { type: string, format: date, description: 'The day, in the user''s zone. Stored as sent.' }
                note:
                  type: string
                  maxLength: 2000
                  description: Why it ended. Required when `verdict` is `dropped`.
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParkedIdea' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The idea's verdict is final: it was dropped, or it was taken and became
            an objective, which is the record of it from then on.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `dropped` was sent without a `note` saying why, or `occurred_on` is in
            the future. A locked idea is not an error — the verdict is recorded as
            early.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /parked-ideas/{ideaId}/notes:
    post:
      tags: [Parking lot]
      summary: Add a note to a parked idea
      description: |
        Append-only: a note is never edited or deleted. Open in every state,
        including after a parked idea has reached a final one.
      operationId: createParkedIdeaNote
      parameters:
        - name: ideaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteWrite' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`written_on` is in the future.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: keel_session
      description: |
        A signed cookie carrying a real expiry. Validating it makes no network
        call, so an open session keeps working while the auth service is
        unreachable (NFR-08).

  parameters:
    objectiveId:
      name: objectiveId
      in: path
      required: true
      schema: { type: string, format: uuid }
    entryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    reviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Invalid:
      description: The request body or a parameter failed validation. `errors` names each field.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: No valid session. The client signs in again; it does not retry.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: |
        No such row, or it belongs to someone else. The two are deliberately
        indistinguishable — a 403 here would confirm the row exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MalformedRecord:
      description: |
        An objective's stored facts are malformed — no status events, or no plan
        segment — so it has no status or no plan to show. The read fails rather
        than guessing a default (`docs/erd.md`, invariant 16). The problem carries
        no user-written text (NFR-11).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: |
        The database could not be reached. The client shows "couldn't reach your
        log" — never a zero, never a blank, never a stale figure without its
        timestamp (NFR-07).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Health:
      type: object
      required: [status, app, database, version, checked_at]
      properties:
        status: { type: string, enum: [ok, degraded] }
        app: { type: string, enum: [ok], description: 'Alive if this body was produced at all.' }
        database: { type: string, enum: [ok, unreachable] }
        version: { type: string, example: '0.1.0' }
        checked_at: { type: string, format: date-time }

    Problem:
      type: object
      description: RFC 9457 Problem Details. One shape for every failure in this API.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: 'https://keel.app/problems/objective-not-active' }
        title: { type: string, example: 'This objective is not active' }
        status: { type: integer, example: 422 }
        detail: { type: string, example: 'Ended objectives accept no new effort.' }
        instance: { type: string, format: uri }
        errors:
          type: array
          description: Field-level detail. Present on 400 only.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: 'minutes' }
              message: { type: string, example: 'Must be between 1 and 1440.' }

    SessionUser:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name:
          type: string
          description: |
            Cognito's `name` attribute, given on Keel's Create account screen and
            copied into the session at sign-in. An account without one shows the
            part of its email before the `@`.

    User:
      type: object
      required: [id, email, tz]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        tz: { type: string, example: 'Asia/Kolkata' }

    ScheduleWrite:
      type: object
      required: [mode, minutes_per_planned_day]
      properties:
        mode:
          type: string
          enum: [fixed, flexible]
          description: |
            A write accepts `fixed` only in v1 (I-09): creating or extending with
            `flexible` is a `422`. Reads keep `flexible` in the enum for v2.
        planned_weekdays:
          type: array
          description: Required when fixed, absent when flexible. 1 is Monday.
          items: { type: integer, minimum: 1, maximum: 7 }
        days_per_week:
          type: integer
          description: Required when flexible, absent when fixed.
          minimum: 1
          maximum: 7
        minutes_per_planned_day: { type: integer, minimum: 15, maximum: 1440 }

    Schedule:
      allOf:
        - $ref: '#/components/schemas/ScheduleWrite'
        - type: object
          properties:
            label: { type: string, example: 'FIXED · MON–SAT · 2h 00m PER DAY' }

    PlanSegment:
      type: object
      required: [id, seq, schedule, start_date, end_date, reason]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, description: '0 is the original plan.' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        reason: { type: string }
        created_by_review_id: { type: [string, 'null'], format: uuid }

    PlanSlot:
      type: object
      description: |
        One planned unit — a day for a fixed segment, a week for a flexible one.
        **Computed, not stored** (ADR-008): the server derives it from the plan
        segment and the objective's status events, so it has no id. A slot is a
        value; two reads of the same day produce equal slots, not the same row.
      required: [period_kind, period_start, period_end, target_minutes]
      properties:
        period_kind: { type: string, enum: [day, week] }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        target_minutes: { type: integer }
        target_days: { type: [integer, 'null'], description: 'Week slots only.' }

    EffortEntryWrite:
      type: object
      required: [local_date, tz, occurred_at_local, minutes, note]
      properties:
        local_date:
          type: string
          format: date
          description: The day the user meant. Never inferred from the request time.
        tz:
          type: string
          description: The zone the entry was made in.
          example: 'Asia/Kolkata'
        occurred_at_local:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: |
            When the work started, which is not when it was logged. With `minutes`
            it is the entry's span, and no two of a user's entries on one day may
            overlap, under any objective. Required.
        minutes: { type: integer, minimum: 1, maximum: 1440 }
        note: { type: string, minLength: 1, maxLength: 2000 }
        link: { type: [string, 'null'], maxLength: 500 }

    EffortEntry:
      allOf:
        - $ref: '#/components/schemas/EffortEntryWrite'
        - type: object
          required: [id, objective_id, logged_at, extra]
          properties:
            id: { type: string, format: uuid }
            objective_id: { type: string, format: uuid }
            logged_at: { type: string, format: date-time }
            extra:
              type: boolean
              description: |
                Computed, not stored. True when no day slot covers this date —
                which includes days the objective was paused.

    ObjectiveWrite:
      type: object
      required:
        [
          title,
          why_now,
          success_criteria,
          schedule,
          starts_on,
          tz,
          runs_for_days,
          review_cadence,
        ]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        why_now:
          type: string
          minLength: 1
          maxLength: 4000
          description: |
            Why this, now. It is also segment 0's `reason`, which the schema requires
            and this body has no separate field for (`docs/erd.md`, plan_segment).
        success_criteria: { type: string, minLength: 1, maxLength: 2000 }
        plan_link: { type: [string, 'null'], format: uri }
        schedule: { $ref: '#/components/schemas/ScheduleWrite' }
        starts_on:
          type: string
          format: date
          description: |
            The day the objective starts, as the user means it. Never inferred from
            the request time — the same discipline as `EffortEntryWrite.local_date`,
            and for the same reason: a plan created at 23:55 belongs to that date for
            good (NFR-12). Required, with no default: an optional date here is the
            server clock with extra steps.
        tz:
          type: string
          description: |
            The zone the objective was declared in. Validated — an unknown IANA zone
            is a `400` — and not stored: the objective records only the day it
            starts, so a zone would be stored and never read (the ERD's reasoning
            for `status_event`, applied here).
          example: 'Asia/Kolkata'
        runs_for_days:
          type: integer
          minimum: 1
          maximum: 366
          description: |
            Counted inclusively from `starts_on`, so a one-day objective starts and
            ends on the same date. Up to 366 so that a 12-month plan fits even when
            it spans a 29 February.
        review_cadence: { type: string, enum: [weekly, monthly] }
        from_parked_idea_id:
          type: [string, 'null']
          format: uuid
          description: |
            Start this objective from an **approved** parked idea. Taking an idea
            *is* creating an objective from it: the idea's `taken` verdict is
            written in the same transaction as the objective, dated today in `tz`,
            and there is no other way to take one.

    Figures:
      type: object
      description: Every field here is computed at read time. None is stored, and none may be written.
      required: [adherence_pct, logged_minutes, target_minutes]
      properties:
        adherence_pct: { type: number, example: 84 }
        logged_minutes: { type: integer, example: 4315 }
        target_minutes: { type: integer, example: 5160 }
        planned_days: { type: integer }
        planned_days_worked: { type: integer }
        target_met_days: { type: integer }
        extra_off_day_minutes: { type: integer }
        over_target_minutes:
          type: integer
          description: |
            Minutes logged above target on planned days, from the same pass
            (`docs/domain/adherence.md`). Never in adherence, which stays capped.
        planned_weeks:
          type: integer
          description: Flexible schedules — the week slots in the span. 0 on a fixed schedule.
        target_met_weeks:
          type: integer
          description: Flexible schedules — the week slots whose logged minutes reach the week's target. 0 on a fixed schedule.

    Track:
      type: [string, 'null']
      enum: [on_track, at_risk, behind, null]
      description: |
        From the adherence so far: `on_track` at 80% or more, `at_risk` from 60 to
        79%, `behind` below 60%. Null until a slot has ended
        (`docs/domain/adherence.md`, *Track*).

    PlanWeek:
      type: object
      required: [period_start, period_end, figures]
      properties:
        period_start: { type: string, format: date }
        period_end: { type: string, format: date, description: 'Inclusive. The last week of a segment may be short.' }
        figures: { $ref: '#/components/schemas/Figures' }

    DueReview:
      type: object
      description: A review window that is due — closed, not saved, with a planned day.
      required: [label, kind, period_start, period_end, review_id]
      properties:
        label: { type: string, example: 'Week 3' }
        kind: { type: string, enum: [weekly, monthly, plan_end] }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        review_id:
          type: [string, 'null']
          format: uuid
          description: The draft started for this window, or null when none is.

    ScheduleGrid:
      type: object
      required: [objective_id, from, to, days]
      properties:
        objective_id: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          items: { $ref: '#/components/schemas/ScheduleDay' }

    ScheduleDay:
      type: object
      required: [date, state, segment_id]
      properties:
        date: { type: string, format: date }
        state:
          type: string
          enum: [target_met, worked_short, planned_no_log, off_day, off_day_worked]
          description: |
            The five states the overview grid renders.
            `target_met` — a planned day whose logged effort met its target.
            `worked_short` — a planned day worked, but under target.
            `planned_no_log` — a planned day with nothing logged.
            `off_day` — not a planned day, nothing logged.
            `off_day_worked` — not a planned day, but effort was logged anyway.
        segment_id:
          type: string
          format: uuid
          description: The plan segment this day falls in. Extensions carry their own schedule.
        logged_minutes: { type: integer, description: 'Effort logged on the day. 0 when none.' }
        target_minutes: { type: integer, description: 'The day''s target. 0 on an off day.' }

    ObjectiveSummary:
      type: object
      required:
        [
          id,
          title,
          status,
          status_since,
          schedule,
          start_date,
          end_date,
          upcoming_review_on,
          figures,
          figures_to_date,
          track,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status:
          type: string
          enum: [active, paused, completed, ended]
          description: |
            Derived from the latest status event, never stored. The stored facts also
            include `created` and `resumed`, which this enum does not: both read as
            `active`. An objective with no status events has no status at all — that
            is a malformed record, not a state, and a read fails rather than
            defaulting (`docs/erd.md`, invariant 16).
        status_since:
          type: string
          format: date
          description: The `occurred_on` of the latest status event — "Paused since", "Ended". Derived.
        schedule: { $ref: '#/components/schemas/Schedule' }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, description: 'The latest segment''s end. Derived.' }
        next_review_on: { type: [string, 'null'], format: date }
        reviews_due:
          type: integer
          minimum: 0
          description: |
            How many reviews are owed — every window that is due, not only the
            earliest. Computed (`docs/domain/review-windows.md`). 0 exactly when
            `next_review_on` is null.
        upcoming_review_on:
          type: [string, 'null']
          format: date
          description: |
            The `period_end` of the earliest window not yet saved, due or not — the
            first review before any is due. Null once none is left, or once the
            objective is completed or ended (`docs/domain/review-windows.md`).
            `next_review_on` keeps its meaning: the earliest *due* window.
        from_parking_lot: { type: boolean }
        figures:
          description: The whole run, including days not yet reached.
          allOf: [{ $ref: '#/components/schemas/Figures' }]
        figures_to_date:
          description: |
            The same rule over the plan so far: the slots that have ended, plus
            today's day slot. A flexible week counts once it has ended
            (`docs/domain/adherence.md`, *So far*).
          allOf: [{ $ref: '#/components/schemas/Figures' }]
        track: { $ref: '#/components/schemas/Track' }

    Objective:
      allOf:
        - $ref: '#/components/schemas/ObjectiveSummary'
        - type: object
          required:
            [
              why_now,
              success_criteria,
              segments,
              status_history,
              notes,
              weeks,
              last_logged_on,
            ]
          properties:
            description: { type: string }
            why_now: { type: string }
            success_criteria: { type: string }
            plan_link: { type: [string, 'null'], format: uri }
            review_cadence: { type: string, enum: [weekly, monthly] }
            original_end_date: { type: string, format: date, description: 'Segment 0''s end. Derived.' }
            extension_count: { type: integer, description: 'A row count. Derived.' }
            segments:
              type: array
              items: { $ref: '#/components/schemas/PlanSegment' }
            status_history:
              type: array
              description: |
                Status events and extensions merged by date. The two are stored
                separately and joined for display, never written twice.
              items: { $ref: '#/components/schemas/StatusEvent' }
            notes:
              type: array
              description: Oldest first. Returned with the objective, so reading notes is not a second call.
              items: { $ref: '#/components/schemas/Note' }
            weeks:
              type: array
              description: |
                One per plan week, oldest first: Monday-to-Sunday weeks clipped to
                each segment, a short first or last week joined to its neighbour —
                the weekly review windows' tiling — each with its figures by the
                same rule (`docs/domain/adherence.md`, *Plan weeks*). A week in
                progress carries its whole target.
              items: { $ref: '#/components/schemas/PlanWeek' }
            last_logged_on:
              type: [string, 'null']
              format: date
              description: The latest `local_date` with an entry, or null when nothing is logged. Derived.
            criteria_verdict:
              type: [string, 'null']
              enum: [met, partly_met, not_met, null]
              description: From the final plan-end review. Derived.

    NoteWrite:
      type: object
      required: [written_on, text]
      properties:
        written_on: { type: string, format: date, description: 'The day, in the user''s zone. Stored as sent.' }
        text: { type: string, minLength: 1, maxLength: 2000 }

    Note:
      allOf:
        - $ref: '#/components/schemas/NoteWrite'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }

    StatusEvent:
      type: object
      required: [occurred_on, change]
      properties:
        occurred_on: { type: string, format: date }
        change: { type: string, enum: [created, paused, resumed, completed, ended, extended] }
        reason: { type: [string, 'null'] }
        new_end_date: { type: [string, 'null'], format: date, description: 'Present only on extended rows.' }

    DayObjective:
      type: object
      required:
        [
          id,
          title,
          start_date,
          schedule,
          slot,
          entries,
          logged_minutes,
          adherence_to_date,
          track,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        start_date:
          type: string
          format: date
          description: Segment 0's start — tells "Not started" and "Day 1" apart from a day off.
        schedule: { $ref: '#/components/schemas/Schedule' }
        slot:
          oneOf:
            - { $ref: '#/components/schemas/PlanSlot' }
            - { type: 'null' }
          description: Null when this date is not planned. Logging is still allowed and counts as extra.
        next_planned_date: { type: [string, 'null'], format: date }
        entries:
          type: array
          items: { $ref: '#/components/schemas/EffortEntry' }
        logged_minutes: { type: integer }
        period_logged_minutes:
          type: integer
          description: For a week slot — the minutes logged in the slot's week, up to and including this date.
        period_days_worked:
          type: integer
          description: For a week slot — the days of the slot's week, up to and including this date, with any effort.
        adherence_to_date:
          type: number
          description: The objective's `figures_to_date.adherence_pct`, so Today stays one call (NFR-03).
        track: { $ref: '#/components/schemas/Track' }

    Day:
      type: object
      required: [date, objectives, totals]
      properties:
        date: { type: string, format: date }
        objectives:
          type: array
          items: { $ref: '#/components/schemas/DayObjective' }
        totals:
          type: object
          properties:
            today_minutes: { type: integer }
            week_minutes: { type: integer, description: 'Monday to Sunday, the week the date falls in.' }
            extra_off_day_minutes:
              type: integer
              description: Minutes no slot covers, over the same Monday-to-Sunday week as `week_minutes`.
            today_planned_minutes:
              type: integer
              description: |
                The targets of the date's fixed day slots. A flexible objective
                plans no particular day, so it adds nothing.
            today_to_go_minutes:
              type: integer
              description: For each of those slots, what is still unlogged, never below zero.
        last_deviation:
          oneOf:
            - { $ref: '#/components/schemas/Deviation' }
            - { type: 'null' }

    EffortMonth:
      type: object
      required: [month, weeks, totals]
      properties:
        month: { type: string, example: '2026-09' }
        weeks:
          type: array
          items:
            type: object
            properties:
              week_start: { type: string, format: date }
              days:
                type: array
                items:
                  type: object
                  required: [date, planned]
                  properties:
                    date: { type: string, format: date }
                    planned: { type: boolean }
                    minutes: { type: [integer, 'null'], description: 'Null means a planned day with no entry.' }
                    note: { type: [string, 'null'] }
                    vs_target: { type: [integer, 'null'] }
              subtotal_minutes: { type: integer }
              planned_days_worked: { type: string, example: '1 of 3 planned days worked' }
        totals:
          type: object
          properties:
            logged_minutes: { type: integer }
            sessions: { type: integer }
            longest_streak_days: { type: integer }
            extra_off_day_minutes: { type: integer }

    DeviationWrite:
      type: object
      required: [objective_ids, local_date, tz, kind, what_happened, minutes]
      properties:
        objective_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
          description: The objectives this deviation pulled you off. At least one.
        local_date: { type: string, format: date }
        tz: { type: string }
        kind: { type: string, enum: [chosen, drifted] }
        what_happened: { type: string, minLength: 1, maxLength: 2000 }
        reasoning:
          type: string
          minLength: 1
          maxLength: 2000
          description: Required when `kind` is `chosen`; a drifted deviation has none.
        did_instead: { type: string, maxLength: 2000 }
        minutes: { type: integer, minimum: 1, maximum: 1440 }
        pattern_id: { type: [string, 'null'], format: uuid, description: 'Null means a genuine one-off.' }

    Deviation:
      allOf:
        - $ref: '#/components/schemas/DeviationWrite'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            pattern_name: { type: [string, 'null'] }
            pattern_nth:
              type: [integer, 'null']
              minimum: 1
              description: |
                This deviation's place among the user's deviations naming the same
                pattern, by date, then as recorded — "3rd time". Null without a
                pattern. Computed.
            review_due_on:
              type: [string, 'null']
              format: date
              description: |
                The review that will judge it: the earliest `period_end` among the
                review windows covering its date, across the objectives it names.
                Null when none covers it (`docs/domain/review-windows.md`).
            verdict:
              type: [string, 'null']
              enum: [worth_it, not_worth_it, null]
              description: Chosen deviations only, set by a review.
            verdict_review_id: { type: [string, 'null'], format: uuid }

    CostTally:
      type: object
      properties:
        count: { type: integer }
        minutes: { type: integer }

    DeviationPattern:
      type: object
      required: [id, name, occurrences]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        occurrences: { type: integer, description: 'Computed. The "3 before" count.' }

    ParkedIdea:
      type: object
      required: [id, idea, why, caught_on, locked_until, verdict, verdict_on, locked, notes]
      properties:
        id: { type: string, format: uuid }
        idea: { type: string }
        why: { type: string }
        caught_on: { type: string, format: date }
        locked_until: { type: string, format: date }
        locked: { type: boolean, description: 'Computed against today.' }
        notes:
          type: array
          description: Oldest first. Returned on every idea in the list, so the parking lot is one read.
          items: { $ref: '#/components/schemas/Note' }
        verdict: { type: string, enum: [parked, approved, taken, dropped], description: 'The latest verdict row.' }
        verdict_on:
          type: string
          format: date
          description: The current verdict's `occurred_on` — "Approved 22 Sep", "Taken 31 Aug".
        note: { type: [string, 'null'] }
        became_objective_id:
          type: [string, 'null']
          format: uuid
          description: Computed — the objective whose `from_parked_idea_id` names this idea. Not stored on the idea.
        decided_early:
          type: boolean
          description: |
            Computed — the current verdict was given before `locked_until`. Always
            false while the idea is parked.

    ReviewWrite:
      type: object
      properties:
        improvement_answer:
          type: [string, 'null']
          enum: [yes, partly, no, not_tried, null]
          description: Did last review's change work. `not_tried` is not `no` — the change was never attempted.
        improvement_answer_note: { type: [string, 'null'], maxLength: 2000 }
        what_worked: { type: [string, 'null'], maxLength: 4000 }
        what_got_in_the_way: { type: [string, 'null'], maxLength: 4000 }
        what_changes_next:
          type: [string, 'null']
          maxLength: 4000
          description: The one the next review quotes back.
        review_summary: { type: [string, 'null'], maxLength: 1000 }
        criteria_assessment:
          type: [string, 'null']
          maxLength: 2000
          description: Plan-end reviews only. Rejected with 422 on any other kind.
        criteria_verdict:
          type: [string, 'null']
          enum: [met, partly_met, not_met, null]
          description: Plan-end reviews only.
        outcome:
          type: [string, 'null']
          enum: [continued, completed, paused, ended, null]
          description: Plan-end reviews only.

    ReviewSummary:
      type: object
      required: [id, kind, period_start, period_end, status]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [weekly, monthly, plan_end] }
        label: { type: string, example: 'Week 3' }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        status: { type: string, enum: [draft, saved] }
        saved_at: { type: [string, 'null'], format: date-time }
        last_saved_at:
          type: [string, 'null']
          format: date-time
          description: When the draft was last written — the "Draft saved" time. Null until the first save.
        outcome: { type: [string, 'null'] }
        review_summary: { type: [string, 'null'] }
        what_changes_next:
          type: [string, 'null']
          description: The change this review set — shown under each saved row.
        adherence_pct:
          type: [number, 'null']
          description: |
            Computed for the period. A `plan_end` review's covers the whole plan,
            from the objective's start to its `period_end`.

    Review:
      allOf:
        - $ref: '#/components/schemas/ReviewSummary'
        - $ref: '#/components/schemas/ReviewWrite'
        - type: object
          required: [objective_id, figures]
          properties:
            objective_id: { type: string, format: uuid }
            due_on: { type: string, format: date }
            previous_review_id: { type: [string, 'null'], format: uuid }
            previous_what_changes_next:
              type: [string, 'null']
              description: The previous saved review's `what_changes_next`, quoted back so this review can answer whether it worked.
            figures:
              description: |
                Computed for the period. A `plan_end` review's figures cover the
                whole plan, from the objective's start to its `period_end`; its
                bars, deviations and quoted change stay on its own period
                (`docs/domain/review-windows.md`).
              allOf: [{ $ref: '#/components/schemas/Figures' }]
            minutes_per_day:
              type: array
              description: The bar chart. Computed for the period.
              items:
                type: object
                properties:
                  date: { type: string, format: date }
                  minutes: { type: integer }
                  planned: { type: boolean }
            deviations:
              type: array
              description: The deviations that name this review's objective and whose date falls in the period.
              items: { $ref: '#/components/schemas/Deviation' }
            parked_ideas:
              type: array
              description: Ideas caught in the period, with the verdict as it stood at period end.
              items: { $ref: '#/components/schemas/ParkedIdea' }

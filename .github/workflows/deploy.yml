name: Deploy

# ADR-004 (R4, W4-07): a deliberate release deploys — merging to main does not.
# Agents merge PRs autonomously, so a merge must not reach production until
# Rohit decides it should. Two ways in:
#
#   - Push a `v*` tag  → forward release. Build once from the tagged commit
#     (image keel:<sha>), migrate, roll the service, smoke-check.
#   - Run it manually (workflow_dispatch) with a `ref` → rollback / redeploy of
#     an EXISTING image. No build, no migrate: the artifact already exists and
#     expand-migrate-contract (ADR-004) keeps older code safe on the newer schema.
#
# Both paths refuse a commit that is not an ancestor of main. That stops an
# honest mistake, not a deliberate bypass: this file runs from the tagged commit
# (or the dispatched branch), so the server-side guard is a tag ruleset on v*
# (ADR-004, known limits). Authenticates via the GitHub OIDC role — no keys.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag (e.g. the previous one) or FULL 40-char commit SHA to redeploy. Its image must already exist in ECR."
        required: true
        type: string

# One deploy at a time; never cancel a deploy in flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # assume the AWS role via OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: 925513250944.dkr.ecr.us-east-1.amazonaws.com/keel
  ECR_REPO_NAME: keel
  CLUSTER: keel
  SERVICE: keel
  MIGRATE_TASK: keel-migrate

jobs:
  deploy:
    runs-on: ubuntu-latest # native amd64 — matches the ECS task platform, no emulation
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag that was pushed, or the ref asked for on a manual run.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0 # full history, so the ancestry check below can see main

      - name: Refuse a commit that is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          SHA=$(git rev-parse 'HEAD^{commit}')
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main. Only commits merged to main can be released or redeployed — refusing to deploy."
            exit 1
          fi
          echo "Deploying ${SHA::12} (${{ github.event_name }})"
          # The 12-char tag every image is pushed under (build once, ADR-004).
          echo "SHORT_SHA=${SHA::12}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::925513250944:role/keel-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      # --- forward release (tag push): build, push, migrate --------------------

      - name: Log in to ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images (app + migrate)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          docker build -f Dockerfile -t "$ECR_REPO:$SHORT_SHA" -t "$ECR_REPO:latest" .
          docker push "$ECR_REPO:$SHORT_SHA"
          docker push "$ECR_REPO:latest"
          docker build -f Dockerfile.migrate -t "$ECR_REPO:migrate-$SHORT_SHA" -t "$ECR_REPO:migrate" .
          docker push "$ECR_REPO:migrate-$SHORT_SHA"
          docker push "$ECR_REPO:migrate"

      - name: Run migration (one-off Fargate task in the VPC)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          SUBNETS=$(aws ec2 describe-subnets \
            --filters Name=tag:Name,Values=keel-public-1,keel-public-2 \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups \
            --filters Name=group-name,Values=keel-task \
            --query 'SecurityGroups[0].GroupId' --output text)
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$MIGRATE_TASK" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "migrate task: $TASK"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "migration exit code: $EXIT"
          test "$EXIT" = "0"

      # --- rollback / redeploy (manual): reuse the existing image --------------

      - name: Point :latest at the existing image (no build, no migrate)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          # The service runs :latest (infra/ecs.tf), so redeploying an earlier
          # release means moving :latest back onto that release's image.
          if ! IMAGE=$(aws ecr batch-get-image --repository-name "$ECR_REPO_NAME" \
              --image-ids imageTag="$SHORT_SHA" \
              --query 'images[0].[imageManifest,imageManifestMediaType]' --output json); then
            echo "::error::Could not read image keel:$SHORT_SHA from ECR."
            exit 1
          fi
          if [ "$IMAGE" = "null" ] || [ -z "$IMAGE" ]; then
            echo "::error::No image keel:$SHORT_SHA in ECR — that commit was never released, so there is nothing to redeploy. Release it with a tag instead."
            exit 1
          fi
          MANIFEST=$(echo "$IMAGE" | jq -r '.[0]')
          MEDIA_TYPE=$(echo "$IMAGE" | jq -r '.[1]')
          if ! OUT=$(aws ecr put-image --repository-name "$ECR_REPO_NAME" --image-tag latest \
              --image-manifest "$MANIFEST" --image-manifest-media-type "$MEDIA_TYPE" 2>&1); then
            # :latest already on this image (e.g. redeploying what is live) is fine.
            if echo "$OUT" | grep -q ImageAlreadyExistsException; then
              echo ":latest already points at keel:$SHORT_SHA"
            else
              echo "$OUT"
              exit 1
            fi
          fi
          echo ":latest -> keel:$SHORT_SHA"

      # --- both paths -----------------------------------------------------------

      - name: Deploy (roll the service to the new image)
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --force-new-deployment >/dev/null
          # Fails (non-zero) if the deployment doesn't stabilise — the circuit
          # breaker rolls back a bad task set automatically.
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Smoke check (/health app + database)
        run: |
          set -euo pipefail
          ALB=$(aws elbv2 describe-load-balancers --names keel \
            --query 'LoadBalancers[0].DNSName' --output text)
          for i in $(seq 1 10); do
            BODY=$(curl -s --max-time 10 "http://$ALB/health" || true)
            echo "attempt $i: $BODY"
            if echo "$BODY" | grep -q '"app":"ok"' && echo "$BODY" | grep -q '"database":"ok"'; then
              echo "smoke check passed"
              exit 0
            fi
            sleep 6
          done
          echo "smoke check failed: /health did not report app+database ok"
          exit 1

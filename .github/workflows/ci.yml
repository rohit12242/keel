name: CI

# ADR-003: the pipeline that gates a merge. Runs on pull_request (never
# pull_request_target), so a fork's code executes with no secrets — every
# stage below is designed to pass without any. Deploy lives in W3-17, on main.
on:
  pull_request:

# One developer pushing fixes should not queue behind themselves: a new commit
# on a branch cancels the in-progress run for that branch (ADR-003).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The eight blocking stages, ordered cheapest-and-most-likely-to-fail first
  # and run as sequential steps so the job stops at the first failure
  # (ADR-003: "fail fast, fail cheap"). This whole job is the required check.
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      # Stage 1 — install, with dependency caching.
      # Node pinned to 26, NOT lts/* (resolves to 24 until late Oct 2026, then
      # jumps) and NOT latest. A pin that changes underneath you is worse than
      # a wrong pin.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so commit-message lint can see the range
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - name: Install
        run: npm ci

      # Stage 2 — format check (fails most often, costs seconds).
      - name: Format check
        run: npm run format:check

      # Stage 3 — lint, including the ADR-001 domain import-boundary rule.
      - name: Lint
        run: npm run lint

      # Stage 4 — typecheck.
      - name: Typecheck
        run: npm run typecheck

      # Stage 5 — unit tests (domain only: no database, no server), run once per
      # timezone (NFR-12, kept half). Same suite under UTC, Asia/Kolkata,
      # Pacific/Kiritimati and America/Los_Angeles; a difference between zones is
      # a date bug. This is the one stage run four times, not a new stage.
      - name: Unit tests (multi-timezone)
        run: npm run test:tz

      # Stage 6 — contract validation: keel-api.yaml is valid OpenAPI 3.1 AND
      # every operation declares a 4xx/5xx response (NFR-07).
      - name: Contract validation
        run: npm run contract

      # Stage 7 — build.
      - name: Build
        run: npm run build

      # Stage 8 — commit message lint: Conventional Commits + Story: W3-xx.
      - name: Commit message lint
        run: npm run commitlint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # Integration tests (ADR-003 integration stage) — the date-storage suite
  # against a real Postgres, run once per timezone (NFR-12, W3-19 follow-up).
  # This is where the pg DATE parser actually bites. Postgres pinned to 18 to
  # match RDS's major (ADR-006). A separate job so it owns the service container
  # and the unit job stays database-free.
  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel_local_dev
          POSTGRES_DB: keel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel -d keel"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Matches docker-compose.yml's local throwaway credentials. Not a secret:
      # a localhost service container that holds no real data.
      DATABASE_URL: postgres://keel:keel_local_dev@localhost:5432/keel
      APP_BASE_URL: http://localhost:3000
      LOG_LEVEL: info
      SEED_DATA: "false"
      SESSION_SECRET: ci-integration-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - name: Install
        run: npm ci
      - name: Migrate
        run: npm run migrate
      - name: Seed
        run: npm run seed
      - name: Integration tests (multi-timezone)
        run: npm run test:integration:tz

  # Stage 9 — dependency audit. ADVISORY: it is the one check whose failures
  # are not caused by the commit under review, so it must never block a merge.
  # Kept a separate job, not added to the required checks, and allowed to be
  # non-green without failing the workflow. It reports; triage is deliberate.
  audit:
    name: audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit
        run: npm audit
